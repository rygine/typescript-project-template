name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Enable Corepack (Yarn)
        # Node 25+ no longer ships Corepack, and setup-node installs the
        # official distribution, so install it from npm first.
        run: |
          npm i -g corepack
          corepack enable

      - name: Install dependencies
        # --immutable so a package.json change without a matching yarn.lock
        # fails here rather than at the Docker build, which installs immutably
        # either way.
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build
